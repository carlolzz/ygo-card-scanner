# `name` is the Dart package name and must stay `ygo_scanner` — every file in
# lib/ and test/ imports `package:ygo_scanner/...`. The *display* name is
# `android:label` in the Android manifest and CFBundleDisplayName/CFBundleName
# on iOS, both of which read "YGO Scanner".
name: ygo_scanner
description: "Catalogue a physical Yu-Gi-Oh card collection by camera."
publish_to: 'none'
version: 0.14.0+15

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  dio: ^5.10.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  # Part of the Flutter SDK, not a pub package. The only source of Italian for
  # Material's own text (the Back tooltip, the copy/paste toolbar, dialog
  # semantics); the app's strings are in lib/core/constants.dart. It pulls in
  # `intl` transitively, but app code still does not import `intl`.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_mlkit_text_recognition: ^0.16.0
  json_annotation: ^4.12.0
  opencv_core: ^1.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.3
  share_plus: ^13.3.0
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  build_runner: ^2.15.1
  sqflite_common_ffi: ^2.4.2
  # Test-only: mock path_provider (a runtime dependency already in the stack)
  # so the CSV exporter can be exercised end-to-end without a device.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  # Build-time only: regenerates the launcher icons from assets/icon/ from a
  # placeholder made by tools/make_icon.py. Not shipped in the app (the runtime
  # stack is unchanged), same pattern as the path_provider test deps above.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/card_hashes.json
    # Localized card names for manual search. Generated, committed, regenerate
    # with `py -3 tools/build_localized_names.py`. English is not shipped here:
    # it is already `cards.name`, populated by the sync.
    - assets/card_names_it.json

# Launcher icon generation. Regenerate with `dart run flutter_launcher_icons`
# after editing the source PNGs. Both must be square (this tool resizes to a
# square target, so a landscape source is stretched, not letterboxed) — run
# hand-drawn art through `py -3 tools/normalize_icon.py <icon> <foreground>`
# first, which also flattens the opaque icon and fits the adaptive foreground
# into its safe zone. `tools/make_icon.py` builds the original placeholder pair.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/ygo_icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/ygo_icon_foreground.png"
